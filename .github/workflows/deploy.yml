name: Deploy Frontend Only

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Enable strict terminal tracing
            set -xe
            
            # 2. Inject explicit NVM paths for the layerbiz user
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"
            
            # 3. Enter target workspace folder (Fixed Typo)
            cd /home/layerbiz/htdocs/://layerbiz.com
            
            # 4. Pull fresh repository changes
            git fetch --all
            git reset --hard origin/main
            
            # 5. Purge the old build folder cache completely
            rm -rf .next
            
            # 6. Install dependencies and trigger fresh production compilation
            npm install
            npm run build
            
            # 7. Mirror asset structures required by standalone server.js
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/. .next/standalone/.next/static/
            
            # 8. Force hard-kill active PM2 threads to clear RAM states
            pm2 delete layerbiz-frontend || true
            pm2 kill || true
            
            # 9. Clean execution boot targeting the raw binary directly
            PORT=3000 HOSTNAME=127.0.0.1 pm2 start .next/standalone/server.js --name "layerbiz-frontend"
            pm2 save
            
            # 10. DIAGNOSTIC PRINT: Wait 3 seconds and print the runtime logs directly to GitHub console
            sleep 3
            pm2 list
            
            echo "=== CURRENT APPLICATION ERROR LOGS ==="
            cat $HOME/.pm2/logs/layerbiz-frontend-error.log | tail -n 20 || true
            
            echo "=== CURRENT APPLICATION OUTPUT LOGS ==="
            cat $HOME/.pm2/logs/layerbiz-frontend-out.log | tail -n 20 || true
