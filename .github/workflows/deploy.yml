name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/layerbiz-admin/htdocs/admin.layerbiz.com
            git pull origin main
            cd backend
            npm install
            npm run build
            pm2 restart layerbiz-backend || pm2 start npm --name "layerbiz-backend" -- start

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/layerbiz/htdocs/layerbiz.com
            git pull origin main
            cd frontend
            npm install
            rm -rf .next
            npm run build
            pm2 restart layerbiz-frontend || pm2 start npm --name "layerbiz-frontend" -- start -- -p 3000