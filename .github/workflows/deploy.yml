name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load Node environment for layerbiz-admin user
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"

            # 2. Navigate and pull down backend code changes
            cd /home/layerbiz-admin/htdocs/://layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            # 3. Clean install and compile Strapi production build
            cd backend
            npm install
            npm run build
            
            # 4. Cycle process safely via PM2
            pm2 restart layerbiz-backend || pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load exact Node/NVM environment for layerbiz site user
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"
            
            # 2. Navigate to the absolute correct folder path (Fixed typo)
            cd /home/layerbiz/htdocs/://layerbiz.com
            
            # 3. Force match codebase state exactly with main branch
            git fetch --all
            git reset --hard origin/main
            
            # 4. Hard purge the old build folder cache completely
            rm -rf .next
            
            # 5. Install dependencies and trigger a fresh production compilation
            npm install
            npm run build
            
            # 6. Map static asset requirements inside standalone folder
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/. .next/standalone/.next/static/
            
            # 7. Completely clear any old conflicting PM2 processes out of memory
            pm2 delete layerbiz-frontend || true
            
            # 8. Start the site via CloudPanel's expected PM2 command (Password-free)
            PORT=3000 pm2 start npm --name "layerbiz-frontend" -- start
            pm2 save
