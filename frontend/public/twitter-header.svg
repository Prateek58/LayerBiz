<svg width="850" height="272" viewBox="0 0 850 272" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="850" height="272" fill="#0f172a" />
  
  <!-- Subtle Grid Pattern for "System Thinking" vibe -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="850" height="272" fill="url(#grid)" />

  <!-- Logo Group -->
  <g transform="translate(64, 45) scale(2.5)">
    <!-- Icon -->
    <rect x="6" y="22" width="12" height="12" rx="1.5" fill="#f97316" />
    <rect x="14" y="14" width="12" height="12" rx="1.5" fill="#f97316" fill-opacity="0.8" />
    <rect x="22" y="6" width="12" height="12" rx="1.5" fill="#f97316" fill-opacity="0.6" />
  </g>
  
  <!-- Logo Text -->
  <text x="170" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="bold" letter-spacing="-1.5">
    <tspan fill="#ffffff">Layer</tspan><tspan fill="#f97316">Biz</tspan>
  </text>

  <!-- Tagline / Info -->
  <text x="75" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Highlighted First Line -->
    <tspan x="75" dy="0" fill="#ffffff" font-size="26" font-weight="600" letter-spacing="-0.5">Vibe-coding speed meets robust product engineering.</tspan>
    
    <!-- Supporting Lines -->
    <tspan x="75" dy="34" fill="#94a3b8" font-size="20" font-weight="400">We preserve your business context and PBIs, ensuring your AI-driven</tspan>
    <tspan x="75" dy="28" fill="#94a3b8" font-size="20" font-weight="400">workflows remain maintainable for the long haul.</tspan>
  </text>
  
  <!-- Bottom Accent Line -->
  <rect x="0" y="268" width="850" height="4" fill="#f97316" />
</svg>
