name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load Node/NVM environment for non-interactive SSH sessions
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # 2. Navigate and update code
            cd /home/layerbiz-admin/htdocs/://layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            # 3. Build Strapi
            cd backend
            npm install
            npm run build
            
            # 4. Restart Strapi Process
            pm2 restart layerbiz-backend || pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load Node/NVM environment for the layerbiz user
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # 2. Navigate and update code
            cd /home/layerbiz/htdocs/layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            cd frontend
            
            # 3. Flush old Next.js build cache completely
            rm -rf .next
            
            # 4. Install dependencies and build
            npm install
            npm run build
            
            # 5. Safe structure creation for Next.js standalone engine
            mkdir -p .next/standalone/.next/
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/ || true
            
            # 6. Delete old process to clear V8 instance memory cache and restart fresh
            pm2 delete layerbiz-frontend || true
            PORT=3000 pm2 start .next/standalone/server.js --name "layerbiz-frontend"
            pm2 save
