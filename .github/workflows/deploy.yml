name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -xe
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"

            cd /home/layerbiz-admin/htdocs/://layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            cd backend
            npm install
            npm run build
            
            pm2 delete layerbiz-backend || true
            pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Enable rigorous tracking outputs
            set -xe
            
            # 2. Inject environment node boundaries
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"
            
            # 3. Enter target workspace folder
            cd /home/layerbiz/htdocs/://layerbiz.com
            
            # 4. Refresh tracking points
            git fetch --all
            git reset --hard origin/main
            
            # 5. Destroy static caching folders
            rm -rf .next
            
            # 6. Execute fresh compilation matrices
            npm install
            npm run build
            
            # 7. Mirror asset structures into standalone target
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/. .next/standalone/.next/static/
            
            # 8. Force hard-kill active PM2 threads to clear RAM states
            pm2 delete layerbiz-frontend || true
            pm2 kill || true
            
            # 9. Clean execution boot targeting the raw binary directly
            PORT=3000 HOSTNAME=127.0.0.1 pm2 start .next/standalone/server.js --name "layerbiz-frontend"
            pm2 save
            
            # 10. DIAGNOSTIC PRINT: Wait 3 seconds and print the runtime logs directly to GitHub console
            sleep 3
            pm2 list
            pm2 info layerbiz-frontend || true
            
            echo "=== CURRENT APPLICATION LOG DUMP ==="
            cat $HOME/.pm2/logs/layerbiz-frontend-error.log | tail -n 20 || true
            cat $HOME/.pm2/logs/layerbiz-frontend-out.log | tail -n 20 || true
