name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/layerbiz-admin/htdocs/admin.layerbiz.com
            # Force clean git state so git pull never fails or merges local noise
            git fetch origin main
            git reset --hard origin/main
            
            cd backend
            npm install
            npm run build
            pm2 restart layerbiz-backend || pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/layerbiz/htdocs/layerbiz.com
            # Force clean git state so git pull never fails or merges local noise
            git fetch origin main
            git reset --hard origin/main
            
            cd frontend
            npm install
            npm run build
            
            # Force PM2 process reload to clear Next.js memory cache
            pm2 reload layerbiz-frontend || pm2 start npm --name "layerbiz-frontend" -- start -- -p 3000
            pm2 save