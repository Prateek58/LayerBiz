name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"

            cd /home/layerbiz-admin/htdocs/admin.layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            cd backend
            npm install
            npm run build
            
            pm2 delete layerbiz-backend || true
            pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load exact Node profile paths
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"

            # 2. Sync repository code
            cd /home/layerbiz/htdocs/layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            cd frontend
            
            # 3. Clean and build fresh production standalone bundle
            rm -rf .next
            npm install
            npm run build
            
            # 4. Map static asset requirements relative to verified base paths
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/. .next/standalone/.next/static/
            
            # 5. Flush old process memory states out of RAM
            pm2 delete layerbiz-frontend || true
            pm2 kill || true
            
            # 6. FIXED LAUNCHER: Target the true server path discovered in logs
            PORT=3000 HOSTNAME=127.0.0.1 pm2 start .next/standalone/server.js --name "layerbiz-frontend"
            pm2 save
            
            # 7. Print confirmation list
            sleep 2
            pm2 list
