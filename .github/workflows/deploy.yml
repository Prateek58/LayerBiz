name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Navigate to backend repository directory
            cd /home/layerbiz-admin/htdocs/admin.layerbiz.com
            git pull origin main
            
            # Move to Strapi folder, install dependencies, and build
            cd backend
            npm install
            npm run build
            
            # Restart or Start PM2 process
            pm2 restart layerbiz-backend || pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Navigate to frontend repository directory
            cd /home/layerbiz/htdocs/layerbiz.com
            git pull origin main
            
            # Move to Next.js folder, install dependencies, and run production build
            cd frontend
            npm install
            npm run build
            
            # Restart PM2 process safely to bind port 3000
            pm2 restart layerbiz-frontend || pm2 start npm --name "layerbiz-frontend" -- start -- -p 3000
            pm2 save