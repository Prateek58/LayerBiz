name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Force the non-interactive shell to act as a login shell to load Node/PM2 paths
            source $HOME/.bashrc || true
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$HOME/.local/bin:$PATH"

            cd /home/layerbiz-admin/htdocs/admin.layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            cd backend
            npm install
            npm run build
            
            pm2 restart layerbiz-backend || pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Force the non-interactive shell to load layerbiz user's specific Node/PM2 paths
            source $HOME/.bashrc || true
            
            cd /home/layerbiz/htdocs/layerbiz.com/frontend
            
            # Fetch and align git tree
            git fetch --all
            git reset --hard origin/main
            
            # Reinstall and force build identical to your manual fix
            npm install
            npm run build
            
            # Use CloudPanel's native standard way to start/restart Next.js via PM2
            PORT=3000 pm2 restart layerbiz-frontend || PORT=3000 pm2 start npm --name "layerbiz-frontend" -- start
            pm2 save
