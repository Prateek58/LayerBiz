name: Deploy Frontend Fresh Loop

on:
  push:
    branches:
      - main

jobs:
  run-fresh-frontend-deployment:
    name: Clean Deployment NextJS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Strict execution log tracking active
            set -xe
            
            # 2. Re-map explicit system path contexts
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"
            
            # 3. Use absolute double-quoted literal path string maps
            cd "/home/layerbiz/htdocs/://layerbiz.com"
            
            # 4. Wipe out git state tracking configurations
            git fetch --all
            git reset --hard origin/main
            
            # 5. Destroy compilation matrices entirely
            rm -rf .next
            
            # 6. Execute direct fresh workspace compilation 
            npm install
            npm run build
            
            # 7. Safe static mapping structures
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/. .next/standalone/.next/static/
            
            # 8. Flush process memory allocation completely
            pm2 delete layerbiz-frontend || true
            pm2 kill || true
            
            # 9. Clean execution boot targeting the raw binary directly
            PORT=3000 HOSTNAME=127.0.0.1 pm2 start .next/standalone/server.js --name "layerbiz-frontend"
            pm2 save
            
            # 10. Wait and log out state prints right here
            sleep 3
            pm2 list
            
            echo "=== RUNTIME LOG DUMPS ==="
            cat $HOME/.pm2/logs/layerbiz-frontend-error.log | tail -n 20 || true
