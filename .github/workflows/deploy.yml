name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            source $HOME/.bashrc || true
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$HOME/.local/bin:$PATH"

            cd /home/layerbiz-admin/htdocs/://layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            cd backend
            npm install
            npm run build
            
            pm2 restart layerbiz-backend || pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load correct Node/PM2 environments for headless shell
            source $HOME/.bashrc || true
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$HOME/.local/bin:$PATH"
            
            cd /home/layerbiz/htdocs/://layerbiz.com
            
            # 2. Reset codebase to align with main
            git fetch --all
            git reset --hard origin/main
            
            # 3. Clean cache and compile fresh production build
            rm -rf .next
            npm install
            npm run build
            
            # 4. Map static assets into the standalone directory structure
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/. .next/standalone/.next/static/
            cp -r public/. .next/standalone/public/ || true
            
            # 5. Flush old runner states and execute the verified standalone path
            pm2 delete layerbiz-frontend || true
            PORT=3000 pm2 start .next/standalone/server.js --name "layerbiz-frontend"
            pm2 save
