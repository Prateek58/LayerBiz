name: Deploy Monorepo to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Strapi Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz-admin
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load exact Node/NVM paths for backend user
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"

            cd /home/layerbiz-admin/htdocs/://layerbiz.com
            git fetch --all
            git reset --hard origin/main
            
            cd backend
            npm install
            npm run build
            
            # Restart Strapi backend
            pm2 delete layerbiz-backend || true
            pm2 start npm --name "layerbiz-backend" -- start
            pm2 save

  deploy-frontend:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: layerbiz
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load exact Node/NVM paths for frontend user
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"
            
            # 2. Enter exact directory
            cd /home/layerbiz/htdocs/://layerbiz.com
            
            # 3. Pull down pure repository changes
            git fetch --all
            git reset --hard origin/main
            
            # 4. Completely wipe the Next.js cache folder out of existence
            rm -rf .next
            
            # 5. Compile the new standalone distribution production build
            npm install
            npm run build
            
            # 6. Map internal static assets required by Next.js standalone binary
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/. .next/standalone/.next/static/
            
            # 7. CRITICAL FIX: Kill PM2 completely to clear cached V8 engine instances
            pm2 delete layerbiz-frontend || true
            pm2 kill || true
            
            # 8. Start the app cleanly using CloudPanel's official formatting
            PORT=3000 HOSTNAME=127.0.0.1 pm2 start npm --name "layerbiz-frontend" -- start
            pm2 save
